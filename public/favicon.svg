<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- Monograma M de Minkaspr. Los colores siguen el tema del navegador/sistema. -->
    <rect class="tile" width="32" height="32" rx="8" />
    <path class="mark" d="M8.5 23V9.5l7.5 8.5 7.5-8.5V23" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
    <style>
        .tile { fill: #005c78; }
        .mark { stroke: #ffffff; }
        @media (prefers-color-scheme: dark) {
            .tile { fill: #4fc3f7; }
            .mark { stroke: #04212e; }
        }
    </style>
</svg>
